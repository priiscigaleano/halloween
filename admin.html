<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Panel Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header><h1>Panel de Administración</h1><nav id="nav" aria-label="Menú de administración"></nav></header>

  <main>
    <h2>Crear disfraz</h2>
    <form class="form-box" id="formNuevo" enctype="multipart/form-data" style="max-width:600px;margin:0 auto 30px">
      <label for="a-nombre">Nombre del disfraz</label>
      <input type="text" id="a-nombre" name="nombre" maxlength="50" required>
      <label for="a-desc">Descripción</label>
      <textarea id="a-desc" name="descripcion" rows="3" required></textarea>
      <label for="a-foto">Foto (JPG, PNG, GIF o WebP, máx. 2 MB)</label>
      <input type="file" id="a-foto" name="foto" accept="image/*">
      <button class="btn" type="submit">Crear</button>
      <div class="msg" id="msgNuevo" role="status" aria-live="polite" aria-atomic="true"></div>
    </form>

    <h2>Listado / Gestión</h2>
    <div class="grid" id="lista"></div>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/efectos.js"></script>
</body>
</html>
